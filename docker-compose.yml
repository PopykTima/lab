version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: my_database
    ports:
      - "5432:5432"