[tool.poetry]
name = "lab1-fastapi"
version = "0.1.0"
description = ""
authors = ["Tima"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "*"
uvicorn = {extras = ["standard"], version = "*"}
pydantic-settings = "*"
sqlalchemy = "*"
asyncpg = "*"
alembic = "*"
passlib = {extras = ["bcrypt"], version = "*"}
pyjwt = "*"
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"